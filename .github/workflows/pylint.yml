name: Pylint

on:
  push:
    paths:
      - '**/*.py'
      - 'pyproject.toml'
      - 'Makefile'
      - '.github/workflows/pylint.yml'

# A newer push makes an in-flight lint of the same ref obsolete.
concurrency:
  group: pylint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install lint tooling
        # Installing the package supplies Hydra for signature analysis; import
        # errors stay disabled because the heavyweight GPU stack is omitted.
        run: pip install -e ".[dev]"

      - name: Analysing the code with pylint
        # The recursive target lets pyproject.toml exclude the vendored solver.
        run: make lint PYLINT_ARGS=--disable=import-error
