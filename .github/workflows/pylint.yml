name: Pylint

on:
  push:
    paths:
      - '**/*.py'
      - 'pyproject.toml'
      - 'Makefile'
      - '.github/workflows/pylint.yml'

# A newer push makes an in-flight lint of the same ref obsolete.
concurrency:
  group: pylint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install lint tooling
        # The dev extra keeps pyproject.toml the only place the pylint pin
        # lives. Installing the package itself also brings in hydra-core, which
        # the signature-mutators setting in pyproject.toml needs in order to
        # resolve `hydra.main` -- without it cli.py trips no-value-for-parameter
        # on the injected `cfg` argument. The heavy stack (torch, vllm,
        # transformers) is pinned in requirements.txt only and is deliberately
        # not installed here, since it is multi-GB and vllm expects a CUDA
        # image -- `--disable=import-error` below compensates.
        run: pip install -e ".[dev]"

      - name: Analysing the code with pylint
        # Mirrors `make lint`. The recursive walk over the repo root (rather
        # than an explicit file list) is what lets ignore-paths in
        # pyproject.toml exclude the vendored Kociemba solver.
        run: make lint PYLINT_ARGS=--disable=import-error
