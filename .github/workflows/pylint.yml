name: Pylint

on: [push]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lint tooling
        # The pinned runtime stack (torch, vllm, transformers) is multi-GB and
        # vllm expects a CUDA image, so it is not installed on this runner --
        # `--disable=import-error` in the lint step compensates. hydra-core is
        # installed because the `hydra.main` signature-mutator configured in
        # pyproject.toml only resolves when hydra is importable; without it
        # cli.py trips no-value-for-parameter on the injected `cfg` argument.
        run: |
          python -m pip install --upgrade pip
          pip install "pylint>=4.0" "hydra-core>=1.3"

      - name: Analysing the code with pylint
        # Mirrors `make lint`. --recursive=y over the repo root (rather than an
        # explicit file list) is what lets ignore-paths in pyproject.toml exclude
        # the vendored Kociemba solver under src/cube_bench/optimal/.
        run: make lint PYTHON=python PYLINT_ARGS=--disable=import-error
