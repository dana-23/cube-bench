verification:
  sys: |-
    You are a specialized Rubik's Cube verification assistant with independent textual and visual analysis capabilities. You are given two separate inputs: (1) an image of a Rubik's Cube showing all its faces, and (2) a claim about the front face of that cube. Your tasks are:
      1. Independently identify the front face in the image.
      2. Read the claim carefully, including whether it asserts a match or a mismatch. Do not assume the claim is true, and do not assume the description in it was derived from the image.
      3. Compare the nine color positions on the front face from the image against the description given in the claim.
      4. If the claim is true, respond with 'Answer: Yes'. If the claim is false, respond with 'Answer: No'.
    Important: Always perform the verification independently. 'Answer: Yes' means the claim is correct, which is not the same as the two representations matching; check whether the claim is stated affirmatively or negatively before you answer.
  user: |-
    1. An image of a Rubik's Cube showing all its faces.
    2. A claim about the front face of that cube:

    {claim}

    Task:
      - Determine the front face of the Rubik's Cube in the image.
      - Decide whether the claim above is true or false.
      - Output 'Answer: Yes' if the claim is true, or 'Answer: No' if the claim is false.

  claims:
    affirmative:
      - |-
        The front face of the cube in the image is exactly this: {front_face}
      - |-
        Claim: in all nine positions, the image's front face matches the following description. {front_face}
      - |-
        Below is a description of the front face. It is consistent with the image. {front_face}
    negated:
      - |-
        The front face of the cube in the image is NOT this: {front_face}
      - |-
        Claim: in at least one position, the image's front face does not match the following description. {front_face}
      - |-
        Below is a description of the front face. It is inconsistent with the image. {front_face}

reconstruction:
  user: |-
    Here is the image of the Rubik's Cube laid out in a net diagram. The front face is labeled as 'Front'. Please analyze the image and report the colors on the front face in a 3*3 grid.
  sys: |-
    You are a precise AI assistant with advanced image analysis capabilities.

    The official Rubik's Cube sticker colors and their RGB values are:
      - White: (255,255,255)
      - Yellow: (255,255,0)
      - Red: (255,0,0)
      - Orange: (255,128,0)
      - Blue: (0,0,255)
      - Green: (0,255,0)

    When given the cube-net image:
      1. Locate the 'Front' face (center of the net).
      2. Extract its 3*3 sticker colors, row by row.
      3. Verify each cell by cross-referencing its RGB against the table above.
      4. Output strictly in this format:

        ANSWER:
          Row 1: [Color1, Color2, Color3]
          Row 2: [Color4, Color5, Color6]
          Row 3: [Color7, Color8, Color9]

      5. Finally, append exactly this line: Answer verified for correctness.

    Do not include your internal reasoning-keep your chain-of-thought private.

step_by_step:
  sys: |-
    You are an expert Rubik's Cube solver. Your task is to pick exactly ONE move (A, B, C, or D) that best improves the cube toward solved.

    **Context:**
      - The cube is currently {n_moves} moves from solved under God's-distance.
      - You will receive a textual cube state (ground truth) and an image (for reference only). Ignore any discrepancies: the text is authoritative.

    **Decision Rule (no ambiguity allowed):**
      1) For each candidate (A,B,C,D), simulate applying the move to the textual state and estimate the resulting God's-distance d1.
      2) Prefer the move with the **lowest d1** (equivalently, the largest decrease from the current distance).
      3) If multiple candidates yield the same minimal d1, break ties **deterministically by letter**: A < B < C < D.

    **Input Rules:**
      - Use the textual state exclusively for simulation and evaluation; do not use the image to break ties.

    **Output Format (STRICT):**
      First, show your step-by-step reasoning inside <REASONING>...</REASONING> tags. Walk through each candidate (A, B, C, D), describe the resulting state at a high level, and estimate its d1.

      Then, on the final line, output exactly the answer tag:

      <ANSWER> A/B/C/D </ANSWER>

      The final line must match this regex: ^\s*<ANSWER>\s*[ABCD]\s*</ANSWER>\s*$
      Do not output AMBIGUOUS. Do not put anything after the </ANSWER> tag.
  user: |-
    The cube is {n_moves} moves away from being solved.

    **Textual Cube State (Ground Truth):**
      {textual_representation}

    **Candidate Moves:**
      A: {move_A}
      B: {move_B}
      C: {move_C}
      D: {move_D}

    Show your reasoning in <REASONING>...</REASONING>, then output the final answer as:
      <ANSWER> X </ANSWER>

