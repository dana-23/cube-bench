name: step-by-step
idk_enabled: false
idk_weight: 0.25
idk_policy: teacher_on_abstain     # teacher_on_abstain | skip_item
idk_conf_threshold: null

# Markov shows only the current state; history sends the full trajectory to API models.
history: false
history_images: true          # false = text-serialized history: prior states as text, current state keeps its image
history_full_responses: true  # false = collapse prior assistant turns to just "<ANSWER> X </ANSWER>"

# Episodes may run concurrently, but their steps remain serial. Keep at one for
# local HF/vLLM models.
concurrency: 1

# Config-keyed JSONL checkpoints resume completed episodes; disable or change the
# directory for a clean run.
checkpoint: true
checkpoint_dir: null   # null = <launch-dir>/checkpoints/step_by_step/

# Replay a matching model/depth prefix to item-pair arms; rebuilt states are
# checked against the seed log. Null disables replay.
seed_run: null
seed_prefix: 1
