name: reflection
reflection_type: Redacted          # Unguided | Redacted | Unredacted
max_reflections: null              # only applies when reflect_all=false (unreachable from here)

# Show the draft answer letter; false renders ``{model_choice}`` as ``[HIDDEN]``.
reveal_choice: true

# ``always`` asserts error on all items; ``when_wrong`` only on errors; ``never``
# supplies no verdict and acts as the control arm.
assert_incorrect: always

# ``legacy`` changes the directive with assertion status; ``neutral`` fixes one
# non-directive re-answer prompt across arms.
reanswer_mode: legacy

# Reuse a run directory, draft.json, or solve_moves_*.json to keep sibling arms
# item-paired on the same initially-correct set.
draft_from: null
