[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cube-bench"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "matplotlib",
  "tqdm",
  "pycuber",
  "kociemba",
  "pyyaml",
  "google-genai",
  "hydra-core>=1.3",
]
readme = "README.md"

[project.scripts]
cube-bench = "cube_bench.cli:main"

[project.optional-dependencies]
dev = [
  "pylint>=4.0",
  "pytest>=8.0",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.package-data]
"cube_bench" = ["configs/*.yaml", "configs/**/*.yaml", "prompts/*.yaml"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["cube_bench*"]
exclude = ["tests*", "docs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Pylint

[tool.pylint.main]
# Keep the vendored Kociemba solver diffable with upstream; fix defects manually
# without applying project-wide style rules.
ignore-paths = ['^src/cube_bench/optimal/(?!__init__\.py).*$']
jobs = 0

[tool.pylint.format]
max-line-length = 120

[tool.pylint.typecheck]
# @hydra.main injects the `cfg` argument at call time, so main() is called with
# no arguments on purpose.
signature-mutators = ["hydra.main.main"]
# Astroid inconsistently resolves model classes exposed through Transformers'
# lazy module attributes, although they exist at runtime.
ignored-modules = ["transformers"]

[tool.pylint.similarities]
# The evaluation modules are deliberately parallel: each benchmark task builds
# the same sample dict and calls the assistant the same way.
min-similarity-lines = 10
ignore-imports = true
ignore-signatures = true

[tool.pylint.basic]
# Preserve domain abbreviations (A-D, L, N, IC) and names fixed by upstream APIs.
good-names = [
  "i", "j", "k", "n", "m", "d", "f", "r", "s", "v", "ex", "Run", "_",
  "A", "B", "C", "D", "L", "N", "IC",
  "AutoProcessor", "SamplingParams",
  "InternVL3_5Strategy", "_balanced_sample_ABCD",
]

[tool.pylint.design]
# Evaluation constructors are wide but keep most parameters keyword-only, so the
# positional limit remains strict.
max-args = 16
max-positional-arguments = 6
max-attributes = 20
max-returns = 13
min-public-methods = 1
# BaseTest exposes the run-template hooks plus the shared cube and MCQ helpers.
max-public-methods = 32

[tool.pylint."messages control"]
disable = [
  # Backend failures are recorded per sample so one provider/CUDA error does not
  # terminate a long evaluation.
  "broad-exception-caught",
  # Heavy optional dependencies are imported only inside their strategies.
  "import-outside-toplevel",
  # Evaluation run methods are intentionally linear pipelines; re-enable size
  # checks if those pipelines are refactored.
  "too-many-locals",
  "too-many-statements",
  "too-many-branches",
  "too-many-lines",
]
